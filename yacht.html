<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>快艇骰子</title>
<meta name="description" content="快艇骰子：五顆骰子、最多擲三次、十三回合。單人對 CPU 或兩人輪流，每計一格分數，你的帆船就沿著航線前進。" />
<meta name="theme-color" content="#0b3a82" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Noto+Sans+TC:wght@500;700;900&family=Permanent+Marker&display=swap" rel="stylesheet" />
<style>
:root{
  --sea:#0b3a82; --sea-deep:#082e6a; --contour:rgba(168,204,255,.17); --sound:rgba(176,204,246,.42);
  --rose:#ff5aa9; --red:#e1262b; --yel:#ffcd00; --blu:#1d4fc0; --blk:#101318; --wht:#f8f7f2;
  --ink:#0d1626; --ink-2:#34466a; --rule:#0d1626; --sand:#e9cd7c;
  --on-sea:#f8f7f2; --on-sea-2:#bfd2f3;
  --p0:#e1262b; --p0-ink:#fff; --p1:#ffcd00; --p1-ink:#101318;
  --cn:'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --num:'Archivo', 'Noto Sans TC', system-ui, sans-serif;
  --hand:'Permanent Marker', 'Archivo', cursive;
  --in:120px; --hal:66px; --pn-w:34px; --pn-h:50px; --gap:16px;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--sea); color:var(--on-sea); font-family:var(--cn); -webkit-text-size-adjust:100%}
body{min-height:100dvh}
::selection{background:var(--yel); color:var(--blk)}
button{font:inherit; color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--yel); outline-offset:3px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.sprite{position:absolute; width:0; height:0; overflow:hidden}
.n{font-family:var(--num); font-stretch:72%; font-variant-numeric:tabular-nums lining-nums}
.ic{width:20px; height:20px; flex:none}

/* ---------- the chart: sea, course lanes, buoys, boats ---------- */
.chart{position:relative; overflow:hidden; background:var(--sea); isolation:isolate; container-type:inline-size;
  display:grid; grid-template-rows:minmax(0,1fr) auto auto minmax(0,1fr); justify-items:center; padding:var(--in)}
.loop{position:absolute; inset:0}
.loop > svg.sea{position:absolute; inset:0; width:100%; height:100%; display:block; z-index:-1}
.sea .contour{fill:none; stroke:var(--contour); stroke-width:1.2}
.sea .sound{fill:var(--sound); font:500 10px var(--num); font-stretch:80%}
.sea .island{fill:var(--sand)}
.sea .island-edge{fill:none; stroke:rgba(233,205,124,.5); stroke-width:1; stroke-dasharray:2 3}
.sea .rose{fill:none; stroke:var(--rose); stroke-width:1.2}
.sea .rose-t{fill:var(--rose); font:700 11px var(--num)}
.sea .course{fill:none; stroke:rgba(248,247,242,.5); stroke-width:1.4; stroke-dasharray:6 7}
.sea .wake{fill:none; stroke-width:4; stroke-linecap:round}
.sea .wake.p0{stroke:var(--p0)} .sea .wake.p1{stroke:var(--p1)}
.sea .buoy circle{fill:var(--yel); stroke:var(--blk); stroke-width:1.5}
.sea .buoy text{fill:var(--blk); font:800 9px var(--num); font-stretch:66%; text-anchor:middle; dominant-baseline:central}
.sea .start{stroke:var(--wht); stroke-width:2.5}
.sea .start-t{fill:var(--wht); font:700 11px var(--cn); letter-spacing:.24em; text-anchor:middle}
.sea .hull{fill:var(--wht); stroke:var(--blk); stroke-width:1.4; stroke-linejoin:round}
.sea .mast{stroke:var(--blk); stroke-width:1.6}
.sea .jib{fill:var(--wht); stroke:var(--blk); stroke-width:1.2; stroke-linejoin:round}
.sea .main,.sea .spinn{stroke:var(--blk); stroke-width:1.2; stroke-linejoin:round}
.sea .spinn{transform-box:fill-box; transform-origin:0 0; transform:scale(0)}
.sea .sailno{font:900 10px var(--num); font-stretch:70%; text-anchor:middle}
.sea .is-turn .hull{stroke-width:2.4}
.sea .boat{transform-box:fill-box; transform-origin:50% 100%}
.sea .boat text{transform-box:fill-box; transform-origin:center}
.sea .flip .boat text{transform:scaleX(-1)}

.deck{grid-row:2; position:relative; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center}
.dock{grid-row:3; position:relative; display:flex; flex-direction:column; align-items:center; gap:18px; margin-top:22px; text-align:center}
.dock-body{display:flex; flex-direction:column; align-items:center; gap:20px}

/* ---------- menu ---------- */
.menu{height:100dvh; min-height:560px; grid-template-rows:minmax(0,1fr) auto minmax(0,1fr); padding:var(--in) 24px}
.menu .deck{gap:18px}
.bunting{position:relative; display:flex; gap:10px; margin:0; padding:2px 0 0}
.bunting::before{content:""; position:absolute; left:-28px; right:-28px; top:0; height:2px; background:var(--wht)}
.bunting svg{width:clamp(38px,4vw,56px); height:auto; aspect-ratio:36/40; display:block}
.bunting li{list-style:none; transform-origin:50% 0}
.title{margin:4px 0 0; font:900 clamp(52px,13vw,128px)/1 var(--cn); letter-spacing:.02em; color:var(--wht)}
.sub{margin:0; font:500 15px/1.6 var(--cn); color:var(--on-sea-2); letter-spacing:.06em}
.keys{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:6px}
.key{appearance:none; border:0; border-radius:3px; min-height:52px; padding:0 22px; font:900 17px/1 var(--cn); letter-spacing:.06em; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:10px; text-decoration:none; transition:background-color .15s, transform .12s}
.key:active{transform:translateY(1px)}
.key-y{background:var(--yel); color:var(--blk)} .key-y:hover{background:#ffd93d}
.key-w{background:var(--wht); color:var(--ink)} .key-w:hover{background:#fff}
.key-y:focus-visible{outline-color:var(--wht)}
.key > svg{width:20px; height:22px}
.back{display:inline-flex; align-items:center; gap:4px; font:500 14px var(--cn); color:var(--on-sea-2); text-decoration:none; padding:10px 6px; border-bottom:1px solid transparent}
.back:hover{color:var(--wht); border-bottom-color:currentColor}

/* ---------- game layout ---------- */
.game{display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,420px); grid-template-rows:auto minmax(0,1fr); height:100dvh; min-height:720px}
.top{grid-column:1/-1; display:flex; align-items:center; gap:14px; padding:0 20px; height:56px; background:var(--sea-deep); border-bottom:1px solid rgba(168,204,255,.18)}
.top .back{padding:8px 4px; border:0}
.top .back .ic{width:24px; height:24px}
.top h1{margin:0; font:900 19px/1 var(--cn); letter-spacing:.06em; display:flex; align-items:center; gap:9px}
.top h1 svg{width:18px; height:20px}
.top .round{margin-left:auto; font:700 14px var(--cn); color:var(--on-sea-2); white-space:nowrap}
.top .round b{font:800 22px/1 var(--num); font-stretch:70%; color:var(--wht); margin:0 2px}
.game .chart{min-height:0}

.tally{display:flex; gap:clamp(18px,4vw,56px); align-items:flex-end; justify-content:center}
.plaque{display:grid; grid-template-columns:auto auto; align-items:end; gap:2px 10px; text-align:left; padding-bottom:8px; position:relative}
.plaque svg{grid-row:1/3; width:34px; height:38px}
.plaque .who{font:700 14px/1.2 var(--cn); color:var(--on-sea-2)}
.plaque .tot{font:900 clamp(44px,7cqw,104px)/.86 var(--num); font-stretch:66%; color:var(--wht); letter-spacing:-.01em}
.plaque::after{content:""; position:absolute; left:0; right:0; bottom:0; height:5px; background:transparent}
.plaque.p0.is-turn::after{background:var(--p0)} .plaque.p1.is-turn::after{background:var(--p1)}
.plaque.is-turn .who{color:var(--wht)}
.status{margin:0; min-height:1.5em; font:700 15px/1.5 var(--cn); color:var(--wht)}
.status .dim{font-weight:500; color:var(--on-sea-2)}
.status.big{font-size:20px; color:var(--yel)}

/* the rack: halyard with pennants over five dice */
.rack{--die:clamp(52px, calc((100cqw - 2 * var(--in) - 4 * var(--gap)) / 5), 84px);
  position:relative; display:flex; gap:var(--gap); padding:var(--hal) 0 0; margin:0; list-style:none}
.rack::before{content:""; position:absolute; left:-18px; right:-18px; top:0; height:2px; background:var(--wht)}
.rack li{position:relative; display:flex; flex-direction:column; align-items:center}
.pennant{position:absolute; top:calc(2px - var(--hal)); left:50%; width:var(--pn-w); height:var(--pn-h); margin-left:calc(var(--pn-w) / -2); transform-origin:50% 0; transform:scaleY(0); transition:transform .26s cubic-bezier(.2,.9,.25,1)}
.pennant svg{width:100%; height:100%; display:block}
.rack li.is-held .pennant{transform:scaleY(1)}
.die{appearance:none; border:0; padding:0; width:var(--die); height:var(--die); border-radius:calc(var(--die)*.2); background:var(--wht); cursor:pointer; display:block; position:relative;
  box-shadow:0 6px 12px rgba(0,0,0,.32), inset 0 -4px 0 rgba(13,22,38,.10); transition:transform .2s cubic-bezier(.2,.9,.25,1), box-shadow .2s}
.die::after{content:""; position:absolute; inset:-6px; border:3px solid var(--yel); border-radius:calc(var(--die)*.2 + 5px); opacity:0; transition:opacity .2s}
.die svg{width:100%; height:100%; display:block}
.die .pip{fill:var(--blk)}
.die:disabled{cursor:default}
.die.is-blank{background:transparent; box-shadow:none; border:2px dashed rgba(191,210,243,.55)}
.rack li.is-held .die{transform:translateY(-6px); box-shadow:0 12px 16px rgba(0,0,0,.34), inset 0 -4px 0 rgba(13,22,38,.10)}
.rack li.is-held .die::after{opacity:1}
.die.tumble{animation:tumble .42s cubic-bezier(.3,.7,.3,1)}
@keyframes tumble{0%{transform:translateY(-14px) rotate(-26deg) scale(.86)}35%{transform:translateY(3px) rotate(14deg) scale(1.06)}65%{transform:translateY(-2px) rotate(-6deg)}100%{transform:none}}

.roll{min-width:260px; min-height:62px; font-size:21px; gap:16px}
.roll .flags{display:inline-flex; gap:5px}
.roll .flags svg{width:22px; height:15px; display:block}
.roll .flags .spent{opacity:.28}
.roll:disabled{background:transparent; color:var(--on-sea-2); box-shadow:inset 0 0 0 2px rgba(191,210,243,.45); cursor:default; transform:none}

.result{display:flex; flex-direction:column; align-items:center; gap:12px}
.finish{position:relative; width:150px; height:58px}
.finish::before{content:""; position:absolute; left:0; right:0; top:0; height:2px; background:var(--wht)}
.finish svg{position:absolute; left:50%; top:2px; width:50px; height:52px; margin-left:-25px; transform-origin:50% 0}
.result h2{margin:0; font:900 clamp(40px,7cqw,96px)/1 var(--cn); color:var(--wht); letter-spacing:.03em}
.result p{margin:0; font:700 17px/1.5 var(--cn); color:var(--on-sea-2)}
.result p .n{font-size:28px; font-weight:900; color:var(--wht)}

/* ---------- results board ---------- */
.board{background:var(--wht); color:var(--ink); overflow:auto; overscroll-behavior:contain; scrollbar-color:var(--ink-2) var(--wht); scrollbar-width:thin}
.board-in{padding:18px 18px 28px}
.board h2{margin:0 0 10px; font:900 18px/1.3 var(--cn); letter-spacing:.08em; display:flex; justify-content:space-between; align-items:baseline}
.board h2 span{font:500 13px var(--cn); letter-spacing:.02em; color:var(--ink-2)}
table{width:100%; border-collapse:collapse; table-layout:fixed}
col.c-cat{width:auto} col.c-p{width:29%}
th,td{height:40px; padding:0 8px; border-bottom:1px solid var(--rule); vertical-align:middle}
thead th{position:sticky; top:0; z-index:2; background:var(--wht); height:48px; border-bottom:3px solid var(--rule); font:700 14px var(--cn); text-align:center}
thead th:first-child{text-align:left}
thead .ph{display:inline-flex; align-items:center; gap:6px; padding:6px 10px 6px 8px; border-radius:2px}
thead .ph svg{width:16px; height:18px}
thead th.is-turn.p0 .ph{background:var(--p0); color:var(--p0-ink)}
thead th.is-turn.p1 .ph{background:var(--p1); color:var(--p1-ink)}
tbody th{font:700 15px var(--cn); text-align:left; white-space:nowrap}
tbody th .cat{display:inline-flex; align-items:center; gap:9px}
tbody th svg{width:13px; height:19px; flex:none}
tbody th svg.fl{width:16px; height:17px}
tbody th .rule{display:block; font:500 11.5px/1.3 var(--cn); color:var(--ink-2); margin-top:1px}
tr.cat-row td{text-align:center; font:800 20px var(--num); font-stretch:72%; font-variant-numeric:tabular-nums}
tr.split th, tr.split td{border-bottom:3px solid var(--rule)}
td .nil{color:#9aa3b5; font-weight:500}
td.scored.zero{color:var(--ink-2); font-weight:600}
td.last{background:var(--yel)}
.pv{appearance:none; width:100%; height:32px; border:0; border-radius:2px; background:#e3eafa; color:var(--blu); cursor:pointer;
  font:400 21px/1 var(--hand); transition:background-color .12s, color .12s}
.pv:hover{background:var(--blu); color:var(--wht)}
.pv.zero{color:#4f6491; background:#edf0f6}
.pv.zero:hover{background:#4f6491; color:var(--wht)}
.pv:focus-visible{outline-color:var(--blu); outline-offset:2px}
tr.sum th{font:500 13px var(--cn); color:var(--ink-2)}
tr.sum th .of{font-size:12px}
tr.sum td{text-align:center; font:700 15px var(--num); font-stretch:76%; color:var(--ink-2)}
tr.sum td .of{font-size:12px; font-weight:500}
tr.sum td.got{color:var(--ink); font-weight:900}
tr.total th{font:900 16px var(--cn); color:var(--ink); border-bottom:0; padding-top:6px}
tr.total td{text-align:center; font:900 30px var(--num); font-stretch:66%; color:var(--ink); border-bottom:0; height:52px}
tr.total{border-top:3px solid var(--rule)}
td.win{background:#fff2b3}
.stamp{animation:stamp .7s cubic-bezier(.2,.9,.25,1)}
@keyframes stamp{0%{transform:scale(1.6)}40%{transform:scale(1)}}

/* ---------- phones and narrow windows: the course on top, the dice dock below it ---------- */
@media (max-width:979px){
  :root{--in:58px; --hal:44px; --pn-w:22px; --pn-h:33px; --gap:8px; --loop-h:240px}
  .game{grid-template-columns:1fr; grid-template-rows:auto auto minmax(0,1fr); min-height:0}
  .top{height:46px; padding:0 10px; gap:8px}
  .top h1{font-size:16px}
  .top .round{font-size:13px}
  .top .round b{font-size:19px}
  .game .chart{grid-template-rows:var(--loop-h) auto; padding:0}
  .game .loop{bottom:auto; height:var(--loop-h)}
  .game .deck{grid-row:1; align-self:center; gap:8px; padding:0 var(--in)}
  .game .dock{grid-row:2; margin:0; padding:0 16px 16px; gap:10px}
  .dock-body{gap:14px}
  .rack{--die:58px}
  .rack::before{left:-12px; right:-12px}
  .plaque svg{width:26px; height:30px}
  .plaque .who{font-size:13px}
  .plaque .tot{font-size:50px}
  .roll{min-width:220px; min-height:50px; font-size:18px}
  .status{font-size:14px}
  .result{gap:8px}
  .result h2{font-size:40px}
  .result p .n{font-size:22px}
  .finish{height:46px}
  .finish svg{width:38px; height:40px; margin-left:-19px}
  .board-in{padding:6px 12px 24px}
  .board h2{display:none}
  thead th{height:44px}
  col.c-p{width:27%}
  .menu{padding:72px 20px}
}
@media (max-width:979px) and (max-height:640px){
  .game{height:auto}
  .board{overflow:visible}
}
@media (max-width:370px){
  .rack{--die:52px}
  tbody th .rule{display:none}
}
@media (max-width:400px){ tbody th .rule{display:none} }
@media (prefers-reduced-motion:reduce){
  .pennant,.die,.key,.die::after{transition:none}
  .die.tumble,.stamp{animation:none}
}
</style>
</head>

  <defs>
    <clipPath id="cp-pn"><path d="M0 0H28L19 40H9Z"/></clipPath>

  <symbol id="pn3" viewBox="0 0 28 40"><g clip-path="url(#cp-pn)"><rect width="28" height="14" fill="#e1262b"/><rect y="13.5" width="28" height="13.5" fill="#f8f7f2"/><rect y="26.5" width="28" height="14" fill="#1d4fc0"/></g><path d="M0 0H28L19 40H9Z" fill="none" stroke="#0a1c3d" stroke-width="1.4"/></symbol>

  <symbol id="fl-y" viewBox="0 0 36 40"><rect width="36" height="40" fill="url(#pt-y)"/><rect x=".7" y=".7" width="34.6" height="38.6" fill="none" stroke="#0a1c3d" stroke-width="1.4"/></symbol>

  <symbol id="fl-h" viewBox="0 0 36 40"><rect width="36" height="20" fill="#f8f7f2"/><rect y="20" width="36" height="20" fill="#e1262b"/><rect x=".7" y=".7" width="34.6" height="38.6" fill="none" stroke="#0a1c3d" stroke-width="1.4"/></symbol>

</svg>

<div id="app"></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const RM = matchMedia('(prefers-reduced-motion: reduce)');

  // ─── State ───────────────────────────────────────────────────────────────────

  const CATEGORIES = [
    { id:'ones',          label:'一點', section:'upper', note:'1 的總和' },
    { id:'twos',          label:'二點', section:'upper', note:'2 的總和' },
    { id:'threes',        label:'三點', section:'upper', note:'3 的總和' },
    { id:'fours',         label:'四點', section:'upper', note:'4 的總和' },
    { id:'fives',         label:'五點', section:'upper', note:'5 的總和' },
    { id:'sixes',         label:'六點', section:'upper', note:'6 的總和' },
    { id:'threeOfAKind',  label:'三同', section:'lower', note:'三顆相同 · 全部點數' },
    { id:'fourOfAKind',   label:'四同', section:'lower', note:'四顆相同 · 全部點數' },
    { id:'fullHouse',     label:'葫蘆', section:'lower', note:'三帶二 · 25' },
    { id:'smallStraight', label:'小順', section:'lower', note:'四連號 · 30' },
    { id:'largeStraight', label:'大順', section:'lower', note:'五連號 · 40' },
    { id:'yacht',         label:'快艇', section:'lower', note:'五顆相同 · 50' },
    { id:'chance',        label:'機會', section:'lower', note:'全部點數' },
  ];

  function blankScorecard() {
    const sc = {};
    CATEGORIES.forEach(c => sc[c.id] = null);
    return sc;
  }

  function blankDice() {
    return Array.from({length:5}, () => ({value:null, held:false}));
  }

  let state = { phase: 'menu' };

  function initState(mode) {
    const names = mode === '1p' ? ['玩家', 'CPU'] : ['玩家一', '玩家二'];
    state = {
      phase: 'playing',
      mode,
      players: names.map((name, i) => ({
        name,
        scorecard: blankScorecard(),
        isCpu: mode === '1p' && i === 1,
      })),
      currentPlayerIndex: 0,
      round: 1,
      dice: blankDice(),
      rollsLeft: 3,
      rollPhase: false,
      cpuThinking: false,
    };
  }

  // ─── Scoring ─────────────────────────────────────────────────────────────────

  function tally(values) {
    const counts = {};
    values.forEach(v => counts[v] = (counts[v] || 0) + 1);
    return counts;
  }

  function sum(values) { return values.reduce((a,b) => a+b, 0); }

  function hasConsecutiveRun(sorted, len) {
    let run = 1;
    for (let i = 1; i < sorted.length; i++) {
      if (sorted[i] === sorted[i-1] + 1) {
        run++;
        if (run >= len) return true;
      } else if (sorted[i] !== sorted[i-1]) {
        run = 1;
      }
    }
    return run >= len;
  }

  function score(categoryId, dice) {
    const values = dice.map(d => d.value);
    if (values.some(v => v === null)) return 0;
    const counts   = tally(values);
    const maxCount = Math.max(...Object.values(counts));
    const totalSum = sum(values);

    switch (categoryId) {
      case 'ones':   return sum(values.filter(v => v===1));
      case 'twos':   return sum(values.filter(v => v===2));
      case 'threes': return sum(values.filter(v => v===3));
      case 'fours':  return sum(values.filter(v => v===4));
      case 'fives':  return sum(values.filter(v => v===5));
      case 'sixes':  return sum(values.filter(v => v===6));
      case 'threeOfAKind':  return maxCount >= 3 ? totalSum : 0;
      case 'fourOfAKind':   return maxCount >= 4 ? totalSum : 0;
      case 'fullHouse': {
        const vals = Object.values(counts);
        return (vals.includes(3) && vals.includes(2)) ? 25 : 0;
      }
      case 'smallStraight': {
        const uniq = [...new Set(values)].sort((a,b) => a-b);
        return hasConsecutiveRun(uniq, 4) ? 30 : 0;
      }
      case 'largeStraight': {
        const uniq = [...new Set(values)].sort((a,b) => a-b);
        return (uniq.length === 5 && hasConsecutiveRun(uniq, 5)) ? 40 : 0;
      }
      case 'yacht': return maxCount === 5 ? 50 : 0;
      case 'chance': return totalSum;
      default: return 0;
    }
  }

  function computeScoreboard(scorecard) {
    const upperIds      = CATEGORIES.filter(c=>c.section==='upper').map(c=>c.id);
    const lowerIds      = CATEGORIES.filter(c=>c.section==='lower').map(c=>c.id);
    const upperFilled   = upperIds.filter(id => scorecard[id] !== null);
    const upperSubtotal = upperFilled.reduce((a,id) => a + scorecard[id], 0);
    const upperDone     = upperFilled.length === upperIds.length;
    const upperBonus    = upperSubtotal >= 63 ? 35 : 0;
    const lowerFilled   = lowerIds.filter(id => scorecard[id] !== null);
    const lowerSubtotal = lowerFilled.reduce((a,id) => a + scorecard[id], 0);
    return { upperSubtotal, upperBonus, upperDone, lowerSubtotal,
             grandTotal: upperSubtotal + upperBonus + lowerSubtotal };
  }

  // ─── Game Actions ─────────────────────────────────────────────────────────────

  let pendingRoll  = [];
  let pendingScore = null;   // { categoryId, playerIndex, value }

  function rollDice() {
    if (state.rollsLeft <= 0) return;
    const rolling = [];
    state.dice.forEach((d, i) => {
      if (!d.held) { d.value = Math.ceil(Math.random() * 6); rolling.push(i); }
    });
    state.rollsLeft--;
    state.rollPhase = true;
    pendingRoll = rolling;
    render();
    say(`${state.players[state.currentPlayerIndex].name}擲出 ${state.dice.map(d => d.value).join('、')}`);
  }

  function toggleHold(i) {
    if (!state.rollPhase || state.rollsLeft <= 0) return;
    state.dice[i].held = !state.dice[i].held;
    render();
  }

  function selectCategory(categoryId) {
    const player = state.players[state.currentPlayerIndex];
    if (player.scorecard[categoryId] !== null) return;
    if (!state.rollPhase) return;

    const value = score(categoryId, state.dice);
    pendingScore = { categoryId, playerIndex: state.currentPlayerIndex, value };
    player.scorecard[categoryId] = value;
    state.dice      = blankDice();
    state.rollsLeft = 3;
    state.rollPhase = false;

    const allDone = state.players.every(p => CATEGORIES.every(c => p.scorecard[c.id] !== null));
    if (allDone) { state.phase = 'gameover'; render(); return; }

    state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.players.length;
    if (state.currentPlayerIndex === 0) state.round++;
    render();

    if (state.players[state.currentPlayerIndex].isCpu) {
      state.cpuThinking = true;
      render();
      cpuTurn();
    }
  }

  function startGame(mode) { initState(mode); render(); }
  function resetGame()     { state = { phase: 'menu' }; render(); }

  // ─── CPU Strategy ─────────────────────────────────────────────────────────────

  function selectDiceToHold(categoryId, dice) {
    const values = dice.map(d => d.value);
    const counts = tally(values);
    switch (categoryId) {
      case 'ones':   return dice.map(d => d.value === 1);
      case 'twos':   return dice.map(d => d.value === 2);
      case 'threes': return dice.map(d => d.value === 3);
      case 'fours':  return dice.map(d => d.value === 4);
      case 'fives':  return dice.map(d => d.value === 5);
      case 'sixes':  return dice.map(d => d.value === 6);
      case 'yacht': case 'threeOfAKind': case 'fourOfAKind': {
        const best = Object.entries(counts).sort((a,b) => b[1]-a[1])[0][0];
        return dice.map(d => String(d.value) === best);
      }
      case 'fullHouse': {
        const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
        const keep = new Set(sorted.slice(0,2).map(e=>e[0]));
        return dice.map(d => keep.has(String(d.value)));
      }
      case 'smallStraight': case 'largeStraight': {
        const uniq = [...new Set(values)].sort((a,b)=>a-b);
        let bestRun = [], curRun = [uniq[0]];
        for (let i=1; i<uniq.length; i++) {
          if (uniq[i] === uniq[i-1]+1) curRun.push(uniq[i]);
          else { if (curRun.length > bestRun.length) bestRun=curRun; curRun=[uniq[i]]; }
        }
        if (curRun.length > bestRun.length) bestRun = curRun;
        const keepSet = new Set(bestRun);
        const held = []; const used = new Set();
        dice.forEach((d,i) => {
          if (keepSet.has(d.value) && !used.has(d.value)) { used.add(d.value); held[i]=true; }
          else held[i]=false;
        });
        return held;
      }
      case 'chance': return dice.map(d => d.value >= 4);
      default: return dice.map(() => false);
    }
  }

  function cpuTurn() {
    const player = state.players[state.currentPlayerIndex];
    function bestAvailableCategory() {
      let best = null, bestScore = -1;
      CATEGORIES.forEach(c => {
        if (player.scorecard[c.id] !== null) return;
        const s = score(c.id, state.dice);
        if (s > bestScore) { bestScore = s; best = c.id; }
      });
      return best;
    }
    function doReroll(rerollsLeft) {
      if (rerollsLeft <= 0 || state.rollsLeft <= 0) {
        setTimeout(() => { state.cpuThinking = false; selectCategory(bestAvailableCategory()); }, 350);
        return;
      }
      setTimeout(() => {
        const cat = bestAvailableCategory();
        const holdMask = selectDiceToHold(cat, state.dice);
        state.dice.forEach((d,i) => { d.held = holdMask[i]; });
        rollDice();
        doReroll(rerollsLeft - 1);
      }, 450);
    }
    setTimeout(() => { rollDice(); doReroll(2); }, 350);
  }

  // ─── Drawing helpers ────────────────────────────────────────────────────────

  const PIP_AT = {
    1: [[30,30]],
    2: [[17,17],[43,43]],
    3: [[17,17],[30,30],[43,43]],
    4: [[17,17],[43,17],[17,43],[43,43]],
    5: [[17,17],[43,17],[30,30],[17,43],[43,43]],
    6: [[17,15],[43,15],[17,30],[43,30],[17,45],[43,45]],
  };
  const dieFace = v => v
    ? `<svg viewBox="0 0 60 60" aria-hidden="true">${PIP_AT[v].map(([x,y]) => `<circle class="pip" cx="${x}" cy="${y}" r="5.6"/>`).join('')}</svg>`
    : '';
  const pennant = v => `<svg viewBox="0 0 28 40" aria-hidden="true"><use href="#pn${v}"/></svg>`;
  const ARROW = `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const PCOL = ['#e1262b', '#ffcd00'];
  const PINK = ['#ffffff', '#101318'];
  // a side-view yacht token: white hull, white jib, mainsail in the player's colour with the sail
  // number, and a spinnaker (scaled to 0) that is set when the player scores a yacht
  const boatG = (pi, cls = '') => `<g class="boat p${pi} ${cls}">
      <path class="spinn" d="M4 -35C40 -38 46 -8 24 -3L9 -3C15 -14 12 -26 4 -35Z" fill="${PCOL[pi]}"/>
      <path class="mast" d="M2 1V-35"/>
      <path class="main" d="M0 -33L0 -3L-18 -3Z" fill="${PCOL[pi]}"/>
      <path class="jib" d="M5 -30L18 -4L5 -4Z"/>
      <path class="hull" d="M-20 0H21L15 8H-15Z"/>
      <text class="sailno" x="-6" y="-9" fill="${PINK[pi]}">${pi + 1}</text>
    </g>`;
  const boatIcon = pi => `<svg viewBox="-22 -38 44 48" aria-hidden="true">${boatG(pi)}</svg>`;
  // the roll counter on the 擲骰 key: three small flown pennants, one comes down per roll
  const rollFlags = left => `<span class="flags" aria-hidden="true">${[0, 1, 2].map(i =>
      `<svg viewBox="0 0 22 15" class="${i < left ? '' : 'spent'}"><path d="M1 1L21 7.5L1 14Z" fill="#101318"/></svg>`).join('')}</span>`;

  // seeded random so the chart's decoration stays put between redraws
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  // ─── The course ─────────────────────────────────────────────────────────────
  // One lap of a rounded-rectangle course = COURSE points. Each lane is the centreline offset in or out.

  const COURSE = 350;
  let geo = null;       // { w, h, c, d, r }

  function laneSpec(off) {
    const { w, h, c, r } = geo;
    return { ins: c + off, rad: Math.max(8, r - off), w, h };
  }
  function lanePath(off) {
    const { ins, rad, w, h } = laneSpec(off), cx = w / 2;
    return `M${cx} ${h-ins}H${w-ins-rad}A${rad} ${rad} 0 0 0 ${w-ins} ${h-ins-rad}V${ins+rad}A${rad} ${rad} 0 0 0 ${w-ins-rad} ${ins}`
         + `H${ins+rad}A${rad} ${rad} 0 0 0 ${ins} ${ins+rad}V${h-ins-rad}A${rad} ${rad} 0 0 0 ${ins+rad} ${h-ins}H${cx}`;
  }
  // point and heading at fraction f (0..1) of a lane, measured from the start line; the course runs
  // counter-clockwise on screen. Lines are [len, start, dir]; arcs are [len, centre, start angle] with
  // the point at centre + rad·(cos θ, sin θ) (y down) and θ decreasing as the boat sails on.
  function laneAt(off, f) {
    const { ins, rad, w, h } = laneSpec(off), cx = w / 2;
    const sx = w - 2*ins - 2*rad, sy = h - 2*ins - 2*rad, q = Math.PI * rad / 2;
    const segs = [
      ['l', w - ins - rad - cx, [cx, h - ins], [1, 0]],
      ['a', q, [w - ins - rad, h - ins - rad], Math.PI / 2],
      ['l', sy, [w - ins, h - ins - rad], [0, -1]],
      ['a', q, [w - ins - rad, ins + rad], 0],
      ['l', sx, [w - ins - rad, ins], [-1, 0]],
      ['a', q, [ins + rad, ins + rad], -Math.PI / 2],
      ['l', sy, [ins, ins + rad], [0, 1]],
      ['a', q, [ins + rad, h - ins - rad], -Math.PI],
      ['l', cx - ins - rad, [ins + rad, h - ins], [1, 0]],
    ];
    const total = segs.reduce((a, sg) => a + sg[1], 0);
    let s = Math.max(0, Math.min(1, f)) * total;
    for (let i = 0; i < segs.length; i++) {
      const [k, len, p, x] = segs[i];
      if (s <= len || i === segs.length - 1) {
        if (k === 'l') return { x: p[0] + x[0] * s, y: p[1] + x[1] * s, dx: x[0], dy: x[1] };
        const t = x - s / rad;
        return { x: p[0] + rad * Math.cos(t), y: p[1] + rad * Math.sin(t), dx: Math.sin(t), dy: -Math.cos(t) };
      }
      s -= len;
    }
  }

  function seaSVG(w, h, withTokens) {
    const mob = w < 640 || h < 400;
    // the outer lane keeps a whole boat (mast included) inside the chart; the lanes sit far enough
    // apart that the two boats never overlap side by side
    geo = { w, h, c: mob ? 42 : 70, d: mob ? 14 : 22, r: mob ? 52 : 110 };
    const R = rng(Math.round(w * 7 + h * 13));
    let s = `<svg class="sea" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">`;
    // depth contours around two shoals (one an islet), plus soundings
    const shoals = [[w*0.86, h*(mob ? 0.86 : 0.8), mob ? 0.55 : 1], [w*0.12, h*0.18, mob ? 0.5 : 0.75]];
    shoals.forEach(([sx, sy, k], si) => {
      for (let ring = 0; ring < 5; ring++) {
        const base = (24 + ring * 30) * k;
        const pts = [];
        const ph = R() * 6;
        for (let a = 0; a < 24; a++) {
          const t = a / 24 * Math.PI * 2;
          const rr = base * (1 + 0.16 * Math.sin(3*t + ph) + 0.08 * Math.cos(5*t + ring));
          pts.push([sx + rr * Math.cos(t) * 1.25, sy + rr * Math.sin(t)]);
        }
        const isle = ring === 0 && si === 0;
        s += `<path class="${isle ? 'island' : 'contour'}" d="${smooth(pts)}"/>`;
        if (isle) s += `<path class="island-edge" d="${smooth(pts.map(([x,y]) => [sx + (x-sx)*1.35, sy + (y-sy)*1.35]))}"/>`;
      }
    });
    const n = mob ? 16 : 34;
    for (let i = 0; i < n; i++) {
      const x = 30 + R() * (w - 60), y = 30 + R() * (h - 60);
      if (Math.abs(x - w / 2) < Math.min(w * 0.4, 380) && Math.abs(y - h / 2) < Math.min(h * 0.3, 300)) continue;
      s += `<text class="sound" x="${x.toFixed(0)}" y="${y.toFixed(0)}">${Math.floor(4 + R() * 38)}${R() < 0.3 ? '<tspan dy="3" font-size="7">' + Math.floor(R()*9) + '</tspan>' : ''}</text>`;
    }
    if (!mob) {   // compass rose in chart magenta, in the corner of the loop (no room for it on phones)
      const rr = mob ? 22 : 40, rx = geo.c + geo.d + rr + (mob ? 10 : 30), ry = h - geo.c - geo.d - rr - (mob ? 10 : 30);
      s += `<g transform="translate(${rx.toFixed(0)} ${ry.toFixed(0)})"><circle class="rose" r="${rr}"/><circle class="rose" r="${rr - rr * 0.18}"/>`;
      for (let a = 0; a < 36; a++) { const t = a / 36 * Math.PI * 2, l = (a % 9 === 0 ? 0.18 : 0.09) * rr;
        s += `<path class="rose" d="M${(rr*Math.sin(t)).toFixed(1)} ${(-rr*Math.cos(t)).toFixed(1)}L${((rr-l)*Math.sin(t)).toFixed(1)} ${(-(rr-l)*Math.cos(t)).toFixed(1)}"/>`; }
      s += `<path d="M0 ${-rr*0.75}L${rr*0.12} 0L0 ${rr*0.75}L${-rr*0.12} 0Z" fill="#ff5aa9" opacity=".85"/><text class="rose-t" y="-${rr+5}" text-anchor="middle">N</text></g>`;
    }
    // course centreline, start line, buoys every 50 points
    s += `<path class="course" d="${lanePath(0)}"/>`;
    const st = laneAt(0, 0);
    s += `<path class="start" d="M${st.x} ${st.y - geo.d - 12}V${st.y + geo.d + 6}"/>`;
    s += `<text class="start-t" x="${st.x}" y="${st.y + geo.d + 20}">起航</text>`;
    for (let p = 50; p < COURSE; p += 50) {
      const b = laneAt(0, p / COURSE);
      s += `<g class="buoy" transform="translate(${b.x.toFixed(1)} ${b.y.toFixed(1)})"><circle r="${mob ? 9 : 12}"/><text style="font-size:${mob ? 9 : 11}px">${p}</text></g>`;
    }
    if (withTokens) {
      [0, 1].forEach(pi => s += `<path class="wake p${pi}" id="wake${pi}" d="${lanePath(pi ? -geo.d : geo.d)}" pathLength="${COURSE}" stroke-dasharray="0 ${COURSE + 10}"/>`);
      [0, 1].forEach(pi => s += `<g id="boat${pi}">${boatG(pi)}</g>`);
    }
    return s + '</svg>';
  }

  function smooth(pts) {
    const n = pts.length; let d = '';
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      if (i === 0) d += `M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    return d + 'Z';
  }

  // ─── Boats on the course ────────────────────────────────────────────────────

  const shown = [0, 0];          // the totals the boats currently sit at
  const anim  = [null, null];
  const boatScale = () => (geo && (geo.w < 640 || geo.h < 400)) ? 0.7 : 1.1;

  function placeBoat(pi, pts) {
    const g = $('#boat' + pi), wake = $('#wake' + pi);
    if (!g || !geo) return;
    const off = pi ? -geo.d : geo.d;
    const p = laneAt(off, Math.min(pts, COURSE - 0.5) / COURSE);
    const flip = p.dx < -0.3 ? -1 : 1;           // sail to the left on the top leg
    g.classList.toggle('flip', flip < 0);
    g.setAttribute('transform', `translate(${p.x.toFixed(1)} ${(p.y + 3).toFixed(1)}) scale(${(boatScale() * flip).toFixed(3)} ${boatScale()})`);
    wake.setAttribute('stroke-dasharray', `${Math.max(0, Math.min(pts, COURSE)).toFixed(2)} ${COURSE + 10}`);
  }

  function sailTo(pi, target) {
    if (anim[pi]) cancelAnimationFrame(anim[pi].raf);
    const from = shown[pi];
    if (RM.matches || from === target) { shown[pi] = target; anim[pi] = null; placeBoat(pi, target); setTot(pi, target); return; }
    const dur = Math.min(1500, 650 + Math.abs(target - from) * 14), t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      shown[pi] = from + (target - from) * e;
      placeBoat(pi, shown[pi]);
      setTot(pi, Math.round(shown[pi]));
      if (k < 1) anim[pi].raf = requestAnimationFrame(step);
      else { shown[pi] = target; anim[pi] = null; }
    };
    anim[pi] = { raf: requestAnimationFrame(step), target };
  }
  function setTot(pi, v) { const el = $(`#tot${pi}`); if (el) el.textContent = v; }

  // yacht (50): the scorer's boat sets its spinnaker and surges
  function spinnaker(pi) {
    const boat = $(`#boat${pi} .boat`), sail = boat && $('.spinn', boat);
    if (!sail) return;
    if (RM.matches) {
      sail.style.transform = 'scale(1)';
      setTimeout(() => { sail.style.transform = ''; }, 2400);
      return;
    }
    sail.animate([{ transform: 'scale(0)' }, { transform: 'scale(1.08)', offset: .25 }, { transform: 'scale(1)', offset: .4 }, { transform: 'scale(1)', offset: .85 }, { transform: 'scale(0)' }],
      { duration: 2600, easing: 'cubic-bezier(.2,.8,.3,1)' });
    boat.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.9)', offset: .3 }, { transform: 'scale(1.9)', offset: .8 }, { transform: 'scale(1)' }],
      { duration: 2600, easing: 'cubic-bezier(.2,.8,.3,1)' });
  }

  // ─── Screens ────────────────────────────────────────────────────────────────

  let screen = null;
  const app = $('#app');
  const lastCell = [null, null];   // each player's most recent row, kept marked on the board

  function drawSea(tokens) {
    const loop = $('#loop');
    const old = $('svg.sea', loop);
    const r = loop.getBoundingClientRect();
    const html = seaSVG(Math.max(300, Math.round(r.width)), Math.max(200, Math.round(r.height)), tokens);
    if (old) old.outerHTML = html; else loop.insertAdjacentHTML('afterbegin', html);
  }

  function say(text) { const el = $('#say'); if (el) { el.textContent = ''; setTimeout(() => { el.textContent = text; }, 30); } }

  function renderMenu() {
    screen = 'menu';
    shown[0] = shown[1] = 0;
    app.innerHTML = `
      <main class="chart menu" id="chart">
        <div class="loop" id="loop"></div>
        <div class="deck">
          <ul class="bunting" aria-label="信號旗 Y A C H T">
            ${['y','a','c','h','t'].map(f => `<li><svg viewBox="0 0 36 40" aria-hidden="true"><use href="#fl-${f}"/></svg></li>`).join('')}
          </ul>
          <h1 class="title">快艇骰子</h1>
          <p class="sub">五顆骰子 · 每回合最多擲三次 · 十三回合</p>
          <div class="keys">
            <button class="key key-y" data-start="1p">${boatIcon(0)}單人對 CPU</button>
            <button class="key key-w" data-start="2p">${boatIcon(1)}兩人輪流</button>
          </div>
          <a class="back" href="index.html">${ARROW}回小工具首頁</a>
        </div>
      </main>`;
    drawSea(true);
    placeBoat(0, 0); placeBoat(1, 0);
    $$('[data-start]').forEach(b => b.addEventListener('click', () => startGame(b.dataset.start)));
    if (!RM.matches) $$('.bunting li').forEach((li, i) =>
      li.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 420, delay: 120 + i * 70, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'backwards' }));
  }

  function buildGame() {
    screen = 'game';
    shown[0] = shown[1] = 0;
    lastCell[0] = lastCell[1] = null;
    const P = state.players;
    app.innerHTML = `
      <div class="game">
        <header class="top">
          <a class="back" href="index.html" aria-label="回小工具首頁">${ARROW}</a>
          <h1><svg viewBox="0 0 36 40" aria-hidden="true"><use href="#fl-y"/></svg>快艇骰子</h1>
          <span class="round" id="round"></span>
        </header>
        <main class="chart" id="chart">
          <div class="loop" id="loop"></div>
          <div class="deck" id="deck">
            <div class="tally">${P.map((p, pi) => `<div class="plaque p${pi}" id="plq${pi}">${boatIcon(pi)}<span class="who">${p.name}</span><span class="tot n" id="tot${pi}">0</span></div>`).join('')}</div>
          </div>
          <div class="dock" id="dock"><p class="status" id="status" tabindex="-1"></p><div class="dock-body" id="dockBody"></div></div>
          <p class="sr" id="say" aria-live="polite"></p>
        </main>
        <section class="board" aria-labelledby="boardH">
          <div class="board-in">
            <h2 id="boardH">成績板 <span>點選分數登記</span></h2>
            <table>
              <colgroup><col class="c-cat"><col class="c-p"><col class="c-p"></colgroup>
              <thead><tr><th scope="col">類別</th>${P.map((p, pi) => `<th scope="col" class="p${pi}" id="ph${pi}"><span class="ph">${boatIcon(pi)}${p.name}</span></th>`).join('')}</tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </div>`;
    drawSea(true);
    placeBoat(0, 0); placeBoat(1, 0);
    $('#rows').addEventListener('click', e => {
      const b = e.target.closest('[data-cat]');
      if (b) selectCategory(b.dataset.cat);
    });
    $('#dock').addEventListener('click', e => {
      const d = e.target.closest('[data-die]');
      if (d) toggleHold(+d.dataset.die);
      if (e.target.closest('#rollKey')) rollDice();
      if (e.target.closest('#again')) resetGame();
    });
  }

  function deckPlaying() {
    const { players, currentPlayerIndex: cur, dice, rollsLeft, rollPhase, cpuThinking } = state;
    const canRoll = rollsLeft > 0 && !cpuThinking;
    const canHold = rollPhase && rollsLeft > 0 && !cpuThinking;
    const name = players[cur].name;
    const status = $('#status');
    status.classList.remove('big');
    if (cpuThinking) status.innerHTML = `CPU 擲骰中…`;
    else if (!rollPhase) status.innerHTML = `${name}的回合 <span class="dim">· 先擲骰</span>`;
    else if (rollsLeft > 0) status.innerHTML = `點骰子保留 <span class="dim">· 再擲或選一格</span>`;
    else status.innerHTML = `擲完了 <span class="dim">· 在成績板選一格</span>`;
    const dock = $('#dockBody');
    if (!$('#rack', dock)) {
      dock.innerHTML = `
        <ul class="rack" id="rack" aria-label="骰子">${dice.map((d, i) => `<li><span class="pennant" aria-hidden="true"></span><button class="die" data-die="${i}"></button></li>`).join('')}</ul>
        <button class="key key-y roll" id="rollKey"></button>`;
    }
    players.forEach((p, pi) => $('#plq' + pi).classList.toggle('is-turn', pi === cur));
    $$('#rack li').forEach((li, i) => {
      const d = dice[i], btn = $('.die', li);
      li.classList.toggle('is-held', !!d.held && d.value !== null);
      $('.pennant', li).innerHTML = d.value ? pennant(d.value) : '';
      btn.classList.toggle('is-blank', !d.value);
      btn.innerHTML = dieFace(d.value);
      btn.disabled = !canHold;
      btn.setAttribute('aria-pressed', d.held ? 'true' : 'false');
      btn.setAttribute('aria-label', d.value ? `第 ${i + 1} 顆，${d.value} 點${d.held ? '，已保留' : ''}` : `第 ${i + 1} 顆，還沒擲`);
    });
    const key = $('#rollKey');
    key.disabled = !canRoll;
    key.innerHTML = cpuThinking ? 'CPU 的回合'
      : canRoll ? `擲骰 ${rollFlags(rollsLeft)}<span class="sr">，還有 ${rollsLeft} 次</span>` : '選一格計分';
    $('#round').innerHTML = `第 <b>${state.round}</b> / 13 回合`;

    if (pendingRoll.length) { tumble(pendingRoll); pendingRoll = []; }
  }

  function tumble(idx) {
    if (RM.matches) return;
    idx.forEach(i => {
      const btn = $(`[data-die="${i}"]`), v = state.dice[i].value;
      if (!btn) return;
      btn.classList.remove('tumble'); void btn.offsetWidth; btn.classList.add('tumble');
      let n = 0;
      const flick = setInterval(() => {
        if (++n > 4 || state.dice[i].value !== v) { clearInterval(flick); if (state.dice[i].value === v) btn.innerHTML = dieFace(v); return; }
        btn.innerHTML = dieFace(1 + Math.floor(Math.random() * 6));
      }, 70);
    });
  }

  function deckGameover() {
    const { players } = state;
    const totals = players.map(p => computeScoreboard(p.scorecard).grandTotal);
    const max = Math.max(...totals), tie = totals.every(t => t === max);
    const w = totals.indexOf(max);
    players.forEach((p, pi) => $('#plq' + pi).classList.toggle('is-turn', !tie && pi === w));
    $('#status').innerHTML = `十三回合結束`;
    $('#dockBody').innerHTML = `
      <div class="result">
        <div class="finish" aria-hidden="true"><svg viewBox="0 0 50 52"><rect x="1" y="0" width="48" height="50" fill="#1d4fc0" stroke="#f8f7f2" stroke-width="2"/></svg></div>
        <h2>${tie ? '平手' : `${players[w].name} 獲勝`}</h2>
        <p>${tie ? `兩艘船同時抵達 · <span class="n">${max}</span> 分` : `<span class="n">${totals[w]}</span> 比 <span class="n">${totals[1 - w]}</span> · 領先 ${totals[w] - totals[1 - w]} 分`}</p>
        <div class="keys"><button class="key key-y" id="again">再玩一次</button><a class="key key-w" href="index.html">回小工具首頁</a></div>
      </div>`;
    $('#round').innerHTML = `比賽結束`;
    // the committee boat hoists the finishing flag
    if (!RM.matches) $('.finish svg').animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 520, delay: 300, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'backwards' });
  }

  function renderBoard() {
    const { players, currentPlayerIndex: cur, dice, rollPhase, cpuThinking, phase } = state;
    const over = phase === 'gameover';
    const boards = players.map(p => computeScoreboard(p.scorecard));
    const max = Math.max(...boards.map(b => b.grandTotal));
    const win = boards.map(b => over && b.grandTotal === max);
    players.forEach((p, pi) => $('#ph' + pi).classList.toggle('is-turn', !over && pi === cur));
    const rows = CATEGORIES.map(cat => {
      const icon = cat.section === 'upper' ? pennant(CATEGORIES.indexOf(cat) + 1)
        : cat.id === 'yacht' ? `<svg class="fl" viewBox="0 0 36 40" aria-hidden="true"><use href="#fl-y"/></svg>` : '';
      const cells = players.map((p, pi) => {
        const v = p.scorecard[cat.id];
        if (v !== null) {
          const last = !over && lastCell[pi] === cat.id;
          return `<td class="scored${v === 0 ? ' zero' : ''}${last ? ' last' : ''}${win[pi] ? ' win' : ''}" data-cell="${cat.id}-${pi}">${v}${last ? '<span class="sr">（剛登記）</span>' : ''}</td>`;
        }
        if (!over && pi === cur && rollPhase && !cpuThinking) {
          const pv = score(cat.id, dice);
          return `<td><button class="pv${pv === 0 ? ' zero' : ''}" data-cat="${cat.id}" aria-label="${cat.label}計 ${pv} 分">${pv}</button></td>`;
        }
        return `<td${win[pi] ? ' class="win"' : ''}><span class="nil" aria-hidden="true">—</span><span class="sr">未填</span></td>`;
      }).join('');
      return `<tr class="cat-row${cat.id === 'sixes' ? ' split' : ''}"><th scope="row"><span class="cat">${icon}<span>${cat.label}<span class="rule">${cat.note}</span></span></span></th>${cells}</tr>`;
    }).join('');
    const sum = (label, f) => `<tr class="sum"><th scope="row">${label}</th>${boards.map((b, pi) => `<td${win[pi] ? ' class="win"' : ''}>${f(b)}</td>`).join('')}</tr>`;
    $('#rows').innerHTML = rows
      + sum('上區小計', b => b.upperDone || b.upperSubtotal >= 63 ? `${b.upperSubtotal}` : `${b.upperSubtotal}<span class="of"> / 63</span>`)
      + `<tr class="sum"><th scope="row">上區獎勵 <span class="of">滿 63 加 35</span></th>${boards.map((b, pi) => `<td class="${b.upperBonus ? 'got' : ''}${win[pi] ? ' win' : ''}">${b.upperBonus ? '+35' : '—'}</td>`).join('')}</tr>`
      + (over ? sum('下區小計', b => b.lowerSubtotal) : '')
      + `<tr class="total"><th scope="row">總計</th>${boards.map((b, pi) => `<td class="n${win[pi] ? ' win' : ''}">${b.grandTotal}</td>`).join('')}</tr>`;
    if (pendingScore && !RM.matches) {
      const cell = $(`[data-cell="${pendingScore.categoryId}-${pendingScore.playerIndex}"]`);
      if (cell) cell.classList.add('stamp');
    }
  }

  function render() {
    if (state.phase === 'menu') { if (screen !== 'menu') renderMenu(); return; }
    if (screen !== 'game') buildGame();
    const focusWasOnBoard = document.activeElement && document.activeElement.closest && document.activeElement.closest('#rows');
    if (pendingScore) lastCell[pendingScore.playerIndex] = pendingScore.categoryId;
    if (state.phase === 'playing') deckPlaying(); else deckGameover();
    renderBoard();
    state.players.forEach((p, pi) => {
      const t = computeScoreboard(p.scorecard).grandTotal;
      if ((anim[pi] ? anim[pi].target : shown[pi]) !== t) sailTo(pi, t);
      $(`#boat${pi}`)?.classList.toggle('is-turn', state.phase === 'playing' && pi === state.currentPlayerIndex);
    });
    if (pendingScore) {
      const { categoryId, playerIndex, value } = pendingScore;
      const cat = CATEGORIES.find(c => c.id === categoryId);
      say(`${state.players[playerIndex].name}在${cat.label}計 ${value} 分`);
      if (categoryId === 'yacht' && value === 50) {
        spinnaker(playerIndex);
        const st = $('#status'); st.classList.add('big'); st.textContent = '快艇！五顆相同 +50';
      }
      pendingScore = null;
    }
    // the board was just rebuilt; keep keyboard users on the dice deck instead of the page top
    if (focusWasOnBoard) {
      const key = $('#rollKey'), again = $('#again');
      (again || (key && !key.disabled ? key : $('#status'))).focus({ preventScroll: true });
    }
  }

  // redraw the chart for the new size, keeping the boats where they are
  let rz = 0;
  addEventListener('resize', () => {
    cancelAnimationFrame(rz);
    rz = requestAnimationFrame(() => {
      if (!$('#loop')) return;
      drawSea(true);
      placeBoat(0, shown[0]); placeBoat(1, shown[1]);
      if (state.phase !== 'menu') state.players.forEach((p, pi) => $(`#boat${pi}`)?.classList.toggle('is-turn', state.phase === 'playing' && pi === state.currentPlayerIndex));
    });
  });

  window.__yacht = { get state() { return state; }, score, computeScoreboard, startGame, resetGame, rollDice, toggleHold, selectCategory, laneAt };
  render();
})();
</script>
</body>
</html>
