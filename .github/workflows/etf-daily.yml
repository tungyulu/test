# Daily snapshot of the 00981A portfolio for etf-00981a.html.
# Uni-President publishes the day's basket around 16:30 Taiwan time; the second run
# catches days when the first one was early or the source was slow.
name: etf-daily

on:
  schedule:
    - cron: '40 9 * * 1-5'   # 17:40 Taiwan time
    - cron: '30 13 * * 1-5'  # 21:30 Taiwan time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch holdings and prices
        run: python3 tools/etf-fetch.py
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/etf-00981a.json
          if git diff --cached --quiet; then
            echo 'No new data.'
            exit 0
          fi
          last=$(python3 -c "import json;print(json.load(open('data/etf-00981a.json'))['days'][-1]['d'])")
          git commit -m "chore(data): 00981A holdings through ${last}"
          git pull --rebase
          git push
